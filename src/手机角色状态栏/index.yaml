头像: null
版本: ''
作者: ''
备注: 'GAL 界面 + MVU 变量（手机角色状态栏 · 艾瑟兰大世界）'

第一条消息:
  - 文件: 第一条消息/0

角色描述: ''

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ''
  - &变量蓝灯
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
  - &世界蓝灯
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
  - &世界绿灯
    启用: true
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 1
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

世界书名称: 手机角色状态栏
条目:
  - 文件夹: 世界观
    条目:
      - 名称: ===世界观开始===
        <<: *分隔符

      - 名称: 艾瑟兰世界总览
        <<: *世界蓝灯
        文件: 世界书/世界观/01_世界总览

      - 名称: 艾瑟兰力量与种族
        <<: *世界蓝灯
        文件: 世界书/世界观/02_力量与种族

      - 名称: 艾瑟兰核心故事线
        <<: *世界蓝灯
        文件: 世界书/世界观/05_核心故事线

      - 名称: 艾瑟兰势力空间格局
        <<: *世界蓝灯
        文件: 世界书/世界观/07_势力空间格局

      - 名称: 艾瑟兰四圣器与守护
        <<: *世界蓝灯
        文件: 世界书/世界观/08_四圣器与守护

      - 名称: 艾瑟兰主线章节
        <<: *世界蓝灯
        文件: 世界书/世界观/09_主线章节

      - 名称: 艾瑟兰战斗数值
        <<: *世界蓝灯
        文件: 世界书/世界观/10_战斗数值

      - 名称: 艾瑟兰地理
        <<: *世界绿灯
        激活策略:
          类型: 绿灯
          关键字:
            - 圣光教会圣地
            - 艾瑟兰王城
            - 中立自由地带
            - 矮人王国废墟
            - 精灵古森林
            - 远古遗迹带
            - 狐族领地
            - 魔女隐域
            - 邪神葬地
            - 天空之门
            - 圣域
            - 生命之树
            - 传送
            - 地图
        文件: 世界书/世界观/03_地理

      - 名称: 艾瑟兰势力格局
        <<: *世界绿灯
        激活策略:
          类型: 绿灯
          关键字:
            - 教会
            - 圣光
            - 王国
            - 夏洛特
            - 女王
            - 反抗军
            - 修伦
            - 护法
            - 四天王
            - 狐族
            - 龙族
            - 血族
            - 精灵族
            - 骑士团
        文件: 世界书/世界观/04_势力格局

      - 名称: 艾瑟兰人物动机
        <<: *世界绿灯
        激活策略:
          类型: 绿灯
          关键字:
            - 莉娅
            - 女神
            - 亚修
            - 魔王
            - 瑟拉菲娜
            - 艾莉亚
            - 伊洛丝
            - 凛
            - 莉莉安
            - 加洛琳娜
            - 埃尔温娜
            - 莱克斯
            - 紫苑
            - 白璃
            - 绯夜
            - 龙族首领
            - 血族首领
            - 四圣器
            - 勇者之剑
            - 生命之心
            - 双翼之盾
            - 心灵之镜
            - 主线章节
            - 天空之门
            - 教主
        文件: 世界书/世界观/06_人物动机

      - 名称: ===世界观结束===
        <<: *分隔符

  - 文件夹: 格式
    条目:
      - 名称: GAL输出格式
        <<: *变量蓝灯
        文件: 世界书/格式/GAL输出格式

      - 名称: 角色CG白名单
        <<: *变量蓝灯
        文件: 世界书/格式/角色CG白名单

      - 名称: 私聊输出格式
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/格式/私聊输出格式

  - 文件夹: 变量
    条目:
      - 名称: ===变量开始===
        <<: *分隔符

      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/initvar

      - 名称: 变量列表
        <<: *变量蓝灯
        文件: 世界书/变量/变量列表

      - 名称: '[mvu_update]变量更新规则'
        <<: *变量蓝灯
        文件: 世界书/变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        <<: *变量蓝灯
        文件: 世界书/变量/变量输出格式

      - 名称: ===变量结束===
        <<: *分隔符

扩展字段:
  正则:
    - 正则名称: '[不发送]去除变量更新'
      id: 2d2018ae-c085-4916-af05-6830110a8293
      启用: true
      查找表达式: /<update(?:variable)?>(?:(?!.*<\/update(?:variable)?>).*$|.*<\/update(?:variable)?>)/gsi
      替换为: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: '[折叠]变量更新中'
      id: ea96523f-a1cc-4634-b9d2-f28531adca6c
      启用: true
      查找表达式: /<update(?:variable)?>(?!.*<\/update(?:variable)?>)\s*(.*)\s*$/gsi
      替换为: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[折叠]完整变量更新'
      id: 06dec31f-c0a9-456c-8b88-1f9176a73039
      启用: true
      查找表达式: /<update(?:variable)?>\s*(.*)\s*<\/update(?:variable)?>/gsi
      替换为: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

  酒馆助手:
