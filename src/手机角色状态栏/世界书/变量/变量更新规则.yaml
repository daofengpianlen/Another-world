---
变量更新规则:
  主角:
    姓名:
    性别:
    身份:
    等级:
      type: number
      range: 1~100
      check:
        - 野外遇敌胜利时由前端自动升级（仅改等级/经验，不改能力四维）
        - 主线/Boss 战胜利后 AI 可 delta，但单次通常不超过 +3
    经验:
      type: number
      check:
        - 表示**当前等级**下已累计的经验（升级时会扣除本级所需，不是生涯总经验）
        - 升级所需 = 40 + 当前等级×20（Lv1→2 需 60，Lv10→11 需 240）
        - 野外遇敌：前端已自动结算时，AI **勿重复** delta 经验
        - 玩家点击「总结遇敌经历」时，摘要中的经验/金币/等级已由前端写入 MVU，AI 只续写剧情、勿重复结算
        - 主线战斗胜利、完成任务时由 AI 根据战报 delta
    金币:
      type: number
      check:
        - 战斗胜利、出售物品、任务奖励时增加；购买、住宿、治疗时减少
        - 战斗结算后由 AI 根据战果发放
    能力.生命:
      type: number
      check:
        - MVU 变量 /主角/能力/生命；基础生命属性，默认 100，界面只显示单个数字
        - 战斗内临时生命 = 生命×等级，由前端演算，**不会**自动写回 MVU
        - 受伤、治疗、升级、装备变更时 replace 或 delta；仅剧情明确需要时才改生命
    能力.力量:
      type: number
      check:
        - MVU 变量 /主角/能力/力量；获得武器、技能突破、等级提升时调整
    能力.体魄:
      type: number
      check:
        - MVU 变量 /主角/能力/体魄；获得防具、体质成长、等级提升时调整
    能力.智慧:
      type: number
      check:
        - MVU 变量 /主角/能力/智慧；学习、技能、状态异常时调整；战斗先手相同时比较智慧
  背包:
    type: |-
      {
        [物品名: string]: {
          描述: string;
          数量?: number;  // 默认为 1
        }
      }
    check:
      - 获得、消耗、丢弃物品时 insert 或 replace 数量
      - 数量归零后 remove 该物品条目
      - 不要一次性添加过多无关杂物
  邂逅名录:
    type: |-
      {
        [NPC名: string]: {
          性别: string;
          身份: string;
          等级: number;
          能力: { 生命: number; 力量: number; 体魄: number; 智慧: number };
          外貌穿着: string;       // 兼容旧字段；有结构化数据时界面优先显示下方分组
          内心想法: string;
          位置: string;
          好感度: number;         // 0~100
          性欲: number;           // 0~100 摘要
          近期性经历: string;     // 兼容；可 migrate 到 互动记录.难忘事件
          外观特征: {
            身高: string; 体型: string; 发色: string; 发型: string; 瞳色: string;
          };
          当前服装: {
            上装: string; 下装: string; 内衣: string; 内裤: string; 袜子: string; 鞋子: string;
          };
          性经验档案: {
            处女: boolean | "是" | "否";
            性交次数: number;
            性伴侣数: number;
            初次对象: string;
            后庭经验: string;
            口交经验: string;
          };
          生理状态: {
            阴道润滑: string; 乳头状态: string; 阴蒂状态: string; 子宫状态: string; 怀孕状态: string;
          };
          互动记录: {
            难忘事件: string[];   // 每条一条字符串，界面以 • 列表展示
          };
        }
      }
    check:
      - 新 NPC 首次重要登场时用 insert 写入完整对象（**不要**包含头像；头像由程序按 NPC 名自动匹配）
      - 已存在 NPC 用 replace 或 delta 更新对应字段；路径示例：/邂逅名录/伊洛丝/外观特征/发色
      - 好感度根据 NPC 对主角行为的感知调整 ±(3~8)，仅在 NPC 知晓该行为时更新
      - 内心想法、位置、当前服装、生理状态应随当前场景及时更新
      - 发生性行为后须更新 性欲、性经验档案（处女→否、性交次数 delta、初次对象等）与 生理状态
      - 重大剧情事件 append 到 /邂逅名录/{名}/互动记录/难忘事件 数组
      - 路人、仅一句话出现的角色不必写入邂逅名录
  邂逅名录完整示例_伊洛丝:
    说明: 首次登场 insert 完整对象；后续用 replace/delta/insert 到子路径更新。**不要**写头像字段。
    stat_data片段: |-
      邂逅名录:
        伊洛丝:
          性别: 女
          身份: 圣光教会圣女
          等级: 5
          能力: { 生命: 100, 力量: 12, 体魄: 10, 智慧: 22 }
          内心想法: ……请问，您叫什么名字？
          位置: 圣光教会圣地·召唤祭坛
          好感度: 35
          性欲: 80
          外观特征:
            身高: 163cm
            体型: 丰满匀称
            发色: 粉色
            发型: 长发
            瞳色: 水晶色
          当前服装:
            上装: 无
            下装: 无
            内衣: 无
            内裤: 无
            袜子: 无
            鞋子: 无
          性经验档案:
            处女: 否
            性交次数: 999
            性伴侣数: 1
            初次对象: user
            后庭经验: 有
            口交经验: 有
          生理状态:
            阴道润滑: 湿润
            乳头状态: 微挺
            阴蒂状态: 敏感
            子宫状态: 排卵期
            怀孕状态: 未怀孕
          互动记录:
            难忘事件:
              - 将user推入现实世界，并在一旁隐身陪伴。
    后续更新示例:
      - { "op": "replace", "path": "/邂逅名录/伊洛丝/当前服装/上装", "value": "白色圣女外袍" }
      - { "op": "delta", "path": "/邂逅名录/伊洛丝/好感度", "value": 5 }
      - { "op": "delta", "path": "/邂逅名录/伊洛丝/性经验档案/性交次数", "value": 1 }
      - { "op": "insert", "path": "/邂逅名录/伊洛丝/互动记录/难忘事件/-", "value": "在召唤祭坛与勇者正式结队。" }
  已解锁CG:
    check:
      - 通常由前端界面根据 background 自动解锁，AI 无需主动更新
      - 若剧情明确强制解锁某 CG 且界面未触发，可 insert 对应 URL 字符串到数组
      - CG 场景名不含 `/`（如「抱起做爱」而非「抱起/做爱」）；`已解锁CG` 数组存的是媒体 URL，不是场景名
      - background 写角色 CG 时，场景名必须来自世界书「角色CG白名单」中该角色的列表，禁止自创
