    HeroineEntry_value: 使用「变量列表 → HeroineEntry_完整模板」，必须含 生理状态 全部 5 个子键

  常见错误_禁止:
    - **在 StatusPlaceHolderImpl 处结束回复、缺少 UpdateVariable**（手机/MVU 完全不更新）
    - 缺少 <UpdateVariable> 或 JSON 语法错误（MVU 不更新）
    - GAL pic 写 i75k8e.mp4 / catbox 链接（须写 手交、日常 等场景名）
    - path: "/stat_data/当前时间"（错误前缀）
    - 自创 path: "/角色好感/秧秧"
    - value: "等待AI填入"
    - 首楼章节字段留空 ""
    - add 女性角色 但缺少 生理状态 / 性爱状态 / 私密资料 子对象
    - GAL `<z>` 内角色名 与 path /女性角色/{名} 必须一致；**女性角色禁止** `<other>` / `<j>`
    - **破处后仍为处女**：输出 `<pic>破处</pic>` 却未 replace /女性角色/{名}/基础信息/是否为处女 为 false
    - **完整性交后性交次数未增加**：须 delta /女性角色/{名}/私密资料/性交次数；禁止用高潮计数代替
    - **首次性交后性伴侣数仍为 0**：须 replace /女性角色/{名}/私密资料/性伴侣数
    - **乳头状态写「勃起」**：应写 平软/正常/微微挺立/挺立（「勃起」仅用于男性）

  解析与界面:
    - Mvu.parseMessage 校验；鸣潮变量结构脚本 zod prefault 补缺字段
    - 手机合并**最新** JSONPatch；勿只写 GAL 占位而漏 replace 剧情字段
    - 人际关系粉色 ❤ 来自 女性角色.{名}.好感度
    - 详见：MVU格式要求 · 变量列表 · 变量更新规则 · 完整首楼回复示例 · 日常亲密场景完整输出示例 · 小爱界面完整输出示例
