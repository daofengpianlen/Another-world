---
变量输出格式:
  硬性规则:
    - 【每条剧情回复必填】assistant 输出 <gal> 时，**末尾必须**含 <UpdateVariable>；禁止在 <StatusPlaceHolderImpl/> 后结束
    - 【必填时机】任何剧情推进、对话、亲密/性爱、时间地点、好感、穿着、生理状态变化 → 必须输出 UpdateVariable
    - 【结构】必须严格使用下列 XML 外壳，JSONPatch 为合法 JSON 数组
    - 【路径】以 / 开头，对应 stat_data 根键；**禁止** /stat_data/... 前缀
    - 【键名】只能使用「变量列表」定义的键名；**禁止**自创根键
    - 【占位符】value 禁止为 "等待AI填入" 或 "等待AI根据用户设定补全…"
    - 【只读】禁止 replace /_storyState/*、/指令/*、/剧情显示（除非世界书明确要求）
    - 【首登场】/女性角色/{名} 用 add 或 insert，value 为**完整 HeroineEntry**（见变量列表模板）
    - 【已登场】用 replace；好感度小改用 delta ±(3~8)
    - 【同 patch】同一角色若 add 已含好感度，勿再 delta 同路径
    - 【布尔】是否在场、是否为后日谈 建议字符串 "true" / "false"
    - 【双轨】推荐同时 add /女性角色/{名} + /contact/{名}；至少要有 /女性角色/{名}
    - 冲突时以「变量更新规则」为准

  标准外壳_每条回复末尾必填:
    说明: 下列不是摘要，是**必须输出的完整结构**；JSONPatch 内必须是真实 JSON，不可用 … 省略
    format: |-
      <StatusPlaceHolderImpl/>
      <UpdateVariable>
      <Analysis>English: time elapsed, what changed, why (max 80 words)</Analysis>
      <JSONPatch>
      [
        { "op": "replace", "path": "/当前时间", "value": "今州历·云陵谷 08:30" },
        { "op": "replace", "path": "/所在地点", "value": "瑝珑-今州·云陵谷·临溪草坡" },
        { "op": "replace", "path": "/主角信息/当前状态", "value": "意识清醒" },
        { "op": "delta", "path": "/女性角色/秧秧/好感度", "value": 3 },
        { "op": "delta", "path": "/女性角色/秧秧/性欲", "value": 2 },
        { "op": "replace", "path": "/女性角色/秧秧/额外信息/内心想法", "value": "他似乎开始信任我了。" }
      ]
      </JSONPatch>
      </UpdateVariable>

