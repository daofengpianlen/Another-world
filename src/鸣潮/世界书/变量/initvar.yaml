# yaml-language-server: $schema=../../schema.json
# ═══════════════════════════════════════════════════════════════
# 鸣潮 MVU 初始变量（第 0 楼 stat_data）
# ═══════════════════════════════════════════════════════════════
# 【世界书】条目名须含 [initvar]；保持【禁用/蓝灯】；新建聊天时 MVU 自动写入第 0 楼
# 【结构权威】键名与嵌套必须与「变量列表」「schema.ts」一致；AI 不得自创字段
# 【开场面板改写】_storyState、主角信息、NPC漂泊者、剧情显示、是否为后日谈、女性角色.{开局角色}骨架
# 【AI 首楼】对下方空字符串 / 等待AI填入 字段执行 replace，写入真实剧情内容（见 MVU格式要求）
# 【contact】不在 initvar 预置；首楼可选 add /contact/{名}，与 /女性角色/{名} 双写

当前时间: ""
所在地点: ""
剧情显示: ""
是否为后日谈: "false"

当前长期目标: ""
当前演绎事件: ""
当前演绎事件节点: ""
即将进行的下一个事件节点: ""
已完成的上一个事件: ""
已完成的上一个事件节点: ""
章节终止条件: ""

主角信息:
  是否是漂泊者: true
  性别: "男"
  身份与额外设定: "寻找归途与失落记忆，且背负着文明火种与救世使命的漂泊者。"
  当前状态: ""
  当前穿着: ""
  性爱状态:
    是否正在性爱: false
    高潮进度: 0
    高潮计数: 0
    _高潮次数上限: 5
  物品栏: {}

NPC漂泊者:
  是否存在: false
  性别: "女"

# 开场面板提交后，脚本 insert 各「开局见到的角色」完整 HeroineEntry 骨架（好感度 10）
# 骨架结构见「变量列表 → HeroineEntry_完整模板」
女性角色: {}

剧情触发器: []
伏笔: []

_storyState:
  majorVerIdx: 0
  partIdx: 0
  isPostScript: false
  _anchorVer: "1.0"

指令:
  推进剧情: null
  跳转版本: null
  修改后日谈模式为: null
