---
变量更新规则:
  说明: |-
    【何时怎么改】本条目定义 stat_data 各字段的更新时机与 JSONPatch 操作选择。
    结构定义见「变量列表」；输出格式见「变量输出格式」；总纲见「MVU格式要求」。
    与变量输出格式冲突时，以本条目为准。

  AI_决策流程:
    步骤1_判断是否有变化: |-
      时间/地点/好感/穿着/物品/章节/角色登场/生理性爱状态/性交次数/性伴侣数/触发器伏笔 任一变化 → 必须输出 <UpdateVariable>
    步骤2_判断角色是否已存在: |-
      stat_data.女性角色 中已有该名 → 用 replace 或 delta
      不存在 → 用 add 或 insert 写入完整 HeroineEntry（见变量列表模板）
      开场面板已预置骨架（好感度 10）→ 用 replace 补全，勿重复 add 同名
    步骤3_选择操作:
      改字符串/对象/布尔 → replace
      新物品/新触发器/新伏笔 → insert path 末尾 /-
      好感度小变动 → delta ±(3~8)
      新 NPC 重要登场 → add /女性角色/{名}（+ 可选 add /contact/{名}）

  界面协作:
    状态页: 当前时间、所在地点、主角信息、女性角色好感度（粉色 ❤）
    剧情页: 章节演绎字段、剧情触发器（明线）、伏笔（暗线）
    好友页: merge(女性角色, contact)；无 女性角色 则列表空
    GAL: `<z>` 内角色名 必须与 /女性角色/{名} 同名；**女性角色禁止** `<other>` / `<j>`
    读取: 合并最新 assistant 消息 JSONPatch，勿只写 GAL 占位而漏 replace

  只读字段_AI禁止修改:
    - /_storyState/*
    - /指令/*
    - /剧情显示（除非世界书明确要求）
    - 主角信息.是否是漂泊者、主角信息.性别（开局后）
    - NPC漂泊者.*（开局后）

  当前时间:
    type: string
    op: replace
    when: 剧情推进、休息、跨时段、旅行耗时
    format: "今州历·{区域} {HH:MM}" 或世界书纪年

  所在地点:
    type: string
    op: replace
    when: 移动、传送、进出室内外
    format: "{大区}-{子区域}·{具体地点}"

  剧情显示:
    op: 不更新
    when: 由 _storyState 自动同步

  是否为后日谈:
    op: 不更新
    when: 开场/指令系统设置

  当前长期目标:
    op: replace
    when: 章节切换、玩家确立新方向、完成旧目标

  当前演绎事件:
  当前演绎事件节点:
  即将进行的下一个事件节点:
  已完成的上一个事件:
  已完成的上一个事件节点:
  章节终止条件:
    op: replace
    when:
      - 首楼：全部 replace 为真实章节内容（禁止留空或 Logic 占位）
      - 节点完成：旧 当前* → 已完成的上一个*，再写新 当前*
      - 章节切换：replace 当前演绎事件/节点/终止条件
    首楼必填: 当前演绎事件、当前演绎事件节点、即将进行的下一个事件节点、章节终止条件、当前长期目标

  主角信息:
    身份与额外设定:
      op: replace
      when: 开局第一条（非漂泊者+AI完善）或重大身份揭露
    当前状态:
      op: replace
      when: 受伤、治疗、中毒、情绪剧变、战斗后
      首楼: 必填
    当前穿着:
      op: replace
      when: 换装、损毁、更衣
      首楼: 必填
    性爱状态:
      op: replace 子字段
      when: 性爱场景开始/进行中/结束
    物品栏:
      op: insert 或 delta
      when:
        - 获得：insert /主角信息/物品栏/{名} value { 数量, 描述, 类型 }
        - 增减：delta /主角信息/物品栏/{名}/数量
        - 耗尽：remove 或 replace 数量后 remove

  女性角色:
    结构: 见「变量列表 → HeroineEntry_完整模板」
    首登场:
      op: add 或 insert
      path: /女性角色/{名}
      value: 完整 HeroineEntry（含 生理状态、私密资料、性爱状态 全部子键）
      同时: 可选 add /contact/{名}（LegacyContact 模板见变量列表）
    已登场_好感度:
      op: delta
      value: ±(3~8)，同 patch 内勿与 add 重复
    已登场_性欲:
      op: delta
      value: ±(3~8)
      when: 亲密互动、暧昧接触、性暗示对话、撩拨调情；角色被冷落时可小幅下降
      max: 100，不与高潮进度混淆（性欲是日常情感值，高潮进度仅限性爱场景）
    已登场_其它:
      op: replace
      常用路径:
        - /女性角色/{名}/是否在场
        - /女性角色/{名}/额外信息/内心想法
        - /女性角色/{名}/当前穿着/上装（或整对象）
        - /女性角色/{名}/生理状态/*
        - /女性角色/{名}/性爱状态/*
        - /女性角色/{名}/性欲
        - /女性角色/{名}/特写（整数组 replace 或按需）
    首楼_对已预置骨架:
      op: replace
      必填补全:
        - 基础信息.*（身高、罩杯、外貌）
        - 当前穿着.*
        - 额外信息.*
        - 生理状态.*（禁止留 "等待AI填入"）
        - 声痕位置、物品（有则写）
    禁止:
      - 写入头像/立绘 URL
      - 路人龙套不必 insert
      - 自创键名

  contact:
    说明: 可选 legacy；与 女性角色 双写时手机 merge
    首登场:
      op: add 或 insert
      path: /contact/{名}
    已登场:
      op: replace 子字段
    分工:
      contact 优先: appearance, clothing, physiological, interaction_records
      女性角色 优先: 额外信息, 特写, 物品, 声痕, 性爱状态, 生理状态(中文), 私密资料
    一致性: relationship.affection 与 女性角色.好感度 建议相同

  生理状态:
    MVU路径: /女性角色/{名}/生理状态/{子键}
    contact路径: /contact/{名}/physiological/{英文键}
    子键:
      阴道润滑: 干燥/轻微湿润/湿润 等
      乳头状态: 平软/正常/微微挺立/挺立/充血挺立（禁止写「勃起」，该词仅用于男性）
      阴蒂状态: 正常/敏感 等
      子宫状态: 正常/…
      是否怀孕: false | true | "false" | "true"
    when: 亲密互动、性爱前后、剧情相关生理变化
    首楼: replace 全部子键为剧情合理初值（非占位符）

  基础信息_是否为处女:
    MVU路径: /女性角色/{名}/基础信息/是否为处女
    界面显示: 手机好友详情「处女」、浪潮状态栏
    初值: true（角色卡设定为非处女则首登场写 false）
    when_必须改为_false:
      - GAL 含 <pic>破处</pic> 或 <pic>破处射精</pic>
      - 剧情明确完成阴道插入/初次性交（即使未写 pic）
    op: replace
    value: false（或 "false"，与楼层其它布尔字段风格一致即可）
    同条_JSONPatch_必写: |-
      { "op": "replace", "path": "/女性角色/{名}/基础信息/是否为处女", "value": false }
    同时建议:
      - replace /女性角色/{名}/私密资料/性爱经验（如「已与漂泊者初次性交」）
      - insert /女性角色/{名}/私密资料/性爱日志/- 记录破处事件
      - 若双写 contact：replace /contact/{名}/sexual_experience/virgin 为 false
      - 性交次数/性伴侣数：在**破处射精或做爱事后结束**同条回复中 delta/replace（见「私密资料_性交次数与性伴侣数」）
    禁止:
      - 破处 CG/剧情后仍为 true
      - 仅更新生理状态而漏改是否为处女

  破处场景:
    说明: pic 播放破处 CG **不会**自动改变量，AI 必须在同条回复的 UpdateVariable 中写入
    GAL: <z>{名}<pic>破处</pic>…</z> 或破处射精
    必更新_checklist:
      - /女性角色/{名}/基础信息/是否为处女 → false
      - /女性角色/{名}/性爱状态/*（进行中/高潮进度等）
      - /女性角色/{名}/生理状态/*（阴道润滑、乳头状态等）
      - /女性角色/{名}/额外信息/内心想法
      - 好感度 delta 或 replace
    完结时_额外必更新:
      - delta /女性角色/{名}/私密资料/性交次数 value 1
      - replace /女性角色/{名}/私密资料/性伴侣数（若此前为 0 → 1）
    详见: 变量输出格式 → 破处场景_示例、性爱事后_完结_示例

  私密资料_性交次数与性伴侣数:
    MVU路径:
      - /女性角色/{名}/私密资料/性交次数
      - /女性角色/{名}/私密资料/性伴侣数
    界面: 手机好友详情「🔒 私密资料」→ 性交次数、性伴侣数
    性交次数_定义: |-
      与该角色每次**完整阴道性交结束** +1（一次 session 以射精/事后结束为准，同一次做爱只 +1）。
      触发 pic 示例：正常位做爱射精、后入位做爱射精、破处射精、做爱事后结束 等。
      **不算**性交次数：手交、口交、足交、乳交、摸胸、接吻、自慰（除非世界书明确要求计入）。
    性交次数_op: delta +1（完结时）；首登场 add 时初值 0
    性伴侣数_定义: |-
      该角色**一生累计**有过完整阴道性交的不同性伴侣人数（通常含 {{user}}）。
      与 {{user}} **首次**完成阴道性交：若此前无性伴侣（处女或仅边缘行为）→ replace 为 1。
      若世界观设定曾有他人 → 首登场或首次性交时 replace 为正确总数（如 2），勿一律写 1。
      与**新的**性伴侣首次性交 → delta +1。
      与同一伴侣重复性交 → **只** delta 性交次数，**勿**再改性伴侣数。
    性伴侣数_op: replace 或 delta（见上）
    双写_contact_可选:
      - delta /contact/{名}/sexual_experience/sex_count value 1
      - replace /contact/{名}/sexual_experience/partner_count
    禁止:
      - 用 /女性角色/{名}/性爱状态/高潮计数 代替性交次数（二者含义不同）
      - 发生完整性交后性交次数仍为 0
      - 与 user 首次性交后性伴侣数仍为 0

  剧情触发器:
    type: array
    op: insert /剧情触发器/-
    item: { 事件类别, 事件简述, 状态, 事件计时 }
    when: 新主线/支线/定时事件
    事件类别: 主线 | 支线 | 明线
    状态: 待触发 | 进行中 | 正常计时 | 已完成
    完成: remove 索引 或 replace 状态

  伏笔:
    type: array
    op: insert /伏笔/-
    item: { 伏笔内容, 指向的预期结果 }
    when: 埋设暗线
    回收: remove 或 replace 说明

  首楼_checklist:
    必做:
      - 输出完整 <gal> + <UpdateVariable>
      - replace 当前时间、所在地点
      - replace 当前长期目标、当前演绎事件、当前演绎事件节点、即将进行的下一个事件节点、章节终止条件
      - replace 主角信息.当前状态、主角信息.当前穿着
      - 对每个登场角色：replace 或 add 完整 女性角色（含 生理状态）
      - 可选 add contact 双轨
      - insert 至少 1 条剧情触发器（明线）、1 条伏笔（暗线）（若剧情有）
    禁止:
      - 留空章节字段
      - value 为 "等待AI填入"
      - 只写 GAL 不写 UpdateVariable
      - 修改 _storyState / 指令

  日常楼层_checklist:
    - Analysis 英文简述变化
    - 仅 patch 实际变化字段（不必每键都写）
    - 好感用 delta；穿着/内心/生理/性爱状态用 replace
    - JSON 合法、path 以 / 开头、无 /stat_data 前缀
    - **禁止**在 StatusPlaceHolderImpl 后结束而不写 UpdateVariable

  亲密_性爱场景_checklist:
    必更新:
      - /女性角色/{名}/性爱状态/是否正在性爱（进行中 true，事后 false）
      - /女性角色/{名}/性爱状态/高潮进度（0~100）
      - /女性角色/{名}/生理状态/*（随剧情）
      - /女性角色/{名}/额外信息/内心想法
      - 好感度 delta 或 replace
    阴道性交_完结_额外必更新:
      - delta /女性角色/{名}/私密资料/性交次数 value 1
      - 若与 user 或新伴侣首次性交：replace /女性角色/{名}/私密资料/性伴侣数（见「私密资料_性交次数与性伴侣数」）
      - insert /女性角色/{名}/私密资料/性爱日志/- 记录本次
      - replace /女性角色/{名}/私密资料/性爱经验（简述，非次数）
    边缘行为_手交口交等:
      - **不** delta 性交次数、**不**改性伴侣数（除非世界书特殊设定）
    破处_额外必更新:
      - /女性角色/{名}/基础信息/是否为处女 → false（见「破处场景」；漏写会导致界面仍显示处女）
    GAL:
      - pic 用 手交、口交、正常位做爱、破处 等场景名，禁止 mp4/catbox 文件名

  不在_stat_data_内_勿_JSONPatch:
    - 论坛、飞讯、CG 收集、壁纸等（chat 变量或前端本地）
